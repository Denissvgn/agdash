[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agdash"
version = "0.1.0"
description = "Read-only dashboard service for agentic coding sessions on this host."
readme = { text = "agdash background service and API.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "jsonschema>=4.21",
    "psutil>=6.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.4,<10",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["agdash*"]

[tool.setuptools.package-data]
agdash = [
    "contracts/*.json",
    "migrations/alembic.ini",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID251"]

# Only the platform layer may ask which operating system it runs on. Everything
# else is handed an agdash.platform.Host, so adapters and the API carry no
# operating-system branches.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.platform".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"os.name".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"os.uname".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.system".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.platform".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.uname".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.mac_ver".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.release".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."
"platform.freedesktop_os_release".msg = "Ask agdash.platform instead: only the platform layer branches on the OS."

[tool.ruff.lint.per-file-ignores]
"agdash/platform/**" = ["TID251"]
