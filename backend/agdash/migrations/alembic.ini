# For writing migrations by hand. The service applies them through
# agdash.db.migrate and does not read this file.
#
#   AGDASH_DATABASE_URL=sqlite:///./dev.db \
#     .venv/bin/alembic -c backend/agdash/migrations/alembic.ini upgrade head

[alembic]
script_location = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
