name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Create the project environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "backend[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff format --check backend
      - name: Test
        working-directory: backend
        run: ../.venv/bin/pytest

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  webkit:
    name: UI in WebKit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # WebKit is the engine of the app's web view on both systems.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit

  specimen:
    name: Chart specimen (Chromium and WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Every chart-kit component in every state, at 1440px and 390px; fails on sideways scroll.
      - run: npm run test:specimen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chart-specimen
          path: frontend/specimen-shots/
          if-no-files-found: error

  desktop:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI the app embeds
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the web view and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Check, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  macos-package:
    name: macOS package (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create the environments
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "backend[freeze]"
          (cd frontend && npm ci)
      # Ad hoc signed: this checks the bundle builds and holds the service, not that it
      # passes Gatekeeper, which needs the Developer ID identity and notarisation.
      - name: Build the app and disk image
        run: desktop/scripts/package-macos.sh
      - name: Check the bundle
        run: |
          APP=desktop/target/package/release/bundle/macos/agdash.app
          test -x "$APP/Contents/MacOS/agdash" && test -x "$APP/Contents/MacOS/agdash-app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = 14.0
          codesign --verify --deep --strict "$APP"
          ls desktop/target/package/release/bundle/dmg/agdash-*.dmg

  ubuntu-packages:
    name: Ubuntu packages (${{ matrix.arch }})
    # Built on the oldest supported release, so the packages run on 22.04 and later.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-22.04 }
          - { arch: arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 file
      - name: Create the environments and build the UI
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "backend[freeze]"
          (cd frontend && npm ci && npm run build)
      - name: Freeze the service, with the UI inside
        working-directory: backend
        run: |
          AGDASH_UI_DIST="$GITHUB_WORKSPACE/frontend/dist" ../.venv/bin/pyinstaller --noconfirm packaging/agdash.spec
          ../.venv/bin/python packaging/smoke.py dist/agdash
      - name: Build the packages
        run: |
          VERSION=$(.venv/bin/python -c "import agdash; print(agdash.__version__)")
          backend/packaging/linux/build-service-deb.sh backend/dist/agdash ${{ matrix.arch }} "$VERSION" out
          mkdir -p desktop/binaries
          cp backend/dist/agdash "desktop/binaries/agdash-$(rustc -vV | sed -n 's/^host: //p')"
          (cd desktop && ../frontend/node_modules/.bin/tauri build --config bundle.linux-deb.json --bundles deb)
          (cd desktop && ../frontend/node_modules/.bin/tauri build --config bundle.linux-appimage.json --bundles appimage)
          cp desktop/target/release/bundle/deb/*.deb desktop/target/release/bundle/appimage/*.AppImage out/
          ls -la out
      - name: The service package, with no display, on 22.04, 24.04 and 26.04
        run: |
          for release in 22.04 24.04 26.04; do
            docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/backend/packaging/linux:/t:ro" \
              "ubuntu:$release" sh /t/test-service-deb.sh "$(ls out/agdash_*.deb | sed 's#^out#/out#')"
          done
      - name: The desktop package installs beside the service
        run: |
          for release in 22.04 24.04; do
            docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/backend/packaging/linux:/t:ro" \
              "ubuntu:$release" sh /t/test-desktop-deb.sh \
              "$(ls out/agdash_*.deb | sed 's#^out#/out#')" "$(ls out/agdash-desktop_*.deb | sed 's#^out#/out#')"
          done
      - name: The AppImage carries the service
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/out/*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/agdash-app
          squashfs-root/usr/bin/agdash --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-packages-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  freeze:
    name: Service binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, os: macos-15, arch: arm64 }
          - { target: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { target: linux-amd64, os: ubuntu-24.04, arch: x86-64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Create the project environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "backend[freeze]"
      - name: Build
        working-directory: backend
        run: ../.venv/bin/pyinstaller --noconfirm --log-level WARN packaging/agdash.spec
      - name: Check the architecture
        working-directory: backend
        run: |
          file dist/agdash
          file dist/agdash | grep -q "${{ matrix.arch }}"
      - name: Smoke test on this runner
        working-directory: backend
        run: python packaging/smoke.py dist/agdash
      - name: Name the binary for its target
        working-directory: backend
        run: mv dist/agdash dist/agdash-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agdash-${{ matrix.target }}
          path: backend/dist/agdash-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
